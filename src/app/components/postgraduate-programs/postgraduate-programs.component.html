  <div class="container py-5">
    <h2 class="text-center mb-4" style="font-weight: 700; font-size: 35px; color: #000000;">
      الدراسات العليا
    </h2>
    <ul class="nav nav-tabs justify-content-start ps-0 mb-0 border-0 px-4" role="tablist">
      <li class="nav-item custom-tab" *ngFor="let cat of categories" role="presentation">
        <button
          (click)="setSelectedCategoryData(cat)"
          class="nav-link"
          [class.active]="selectedCategory?.id == cat.id"
          type="button"
          role="tab">
          {{ cat.nameAr }}
        </button>
      </li>
    </ul>
  
    <div class="content-box">
      <div *ngIf="selectedCategoryContent" class="main-content text-center mb-3">
        <p>{{ selectedCategoryContent }}</p>
      </div>
  
      <div *ngIf="showSubCategories" class="subcategories-container mb-3">
        <ul class="subcategories-list">
          <li *ngFor="let sub of subCategories"
              [class.active]="selectedSubCategoryId === sub.id"
              (click)="selectSubCategory(sub)">
            {{ sub.nameAr }}
          </li>
        </ul>
      </div>
  
      <div *ngIf="selectedSubCategoryContent !== null" class="sub-category-content-box">
        <p *ngIf="selectedSubCategoryContent; else noContent" style="text-align: justify; white-space: pre-line;" >
          {{ selectedSubCategoryContent }}
        </p>
        <ng-template #noContent>
          <p class="no-file-text">لا يوجد محتوى</p>
        </ng-template>
      </div>
      
    </div>
  </div>
