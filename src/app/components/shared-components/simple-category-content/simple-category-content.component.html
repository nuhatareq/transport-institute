
@if (title === 'الدراسات العليا') {
  <div class="text-center py-4" style="font-weight: 700; font-size: 35px; color: #000000;">
    {{ title }}
  </div>
}

  
  <ul class="nav nav-tabs justify-content-start ps-0 mb-0 border-0 px-5" role="tablist">
    @for (cat of categories; track cat) {
      <li class="nav-item custom-tab" role="presentation">
        <button
          (click)="setSelectedCategoryData(cat)"
          class="nav-link"
          [class.active]="selectedCategory?.id == cat.id"
          type="button"
          role="tab">
          {{ cat.nameAr }}
        </button>
      </li>
    }
  </ul>
  
  <div class="tab-content mt-0 px-4">
    <div class="tab-pane fade show active" role="tabpanel">
      <div class="content-box">
        <div class="row">
          <p class="py-2" style="font-size: 25px;" [innerHTML]="categoryData[0]?.contentAr"></p>
        </div>
  
        <div class="row">
          <p class="py-2" style="font-size: 25px;" [innerHTML]="categoryData?.contentEn"></p>
        </div>
      </div>
    </div>
  </div>
