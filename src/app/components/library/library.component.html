    <div class="text-center py-4" style="font-weight: 700; font-size: 35px; color: #000000;">
      المكتبة
    </div>
    
    <ul class="nav nav-tabs justify-content-center mb-3" role="tablist">
      <li class="nav-item">
        <button
          class="nav-link"
          [class.active]="selectedCategory === 'arabic'"
          (click)="setSelectedCategory('arabic')">
          الكتب العربية
        </button>
      </li>
      <li class="nav-item">
        <button
          class="nav-link"
          [class.active]="selectedCategory === 'foreign'"
          (click)="setSelectedCategory('foreign')">
          الكتب الأجنبية
        </button>
      </li>
    </ul>
    
    <div class="container mt-4">
      <div class="table-responsive">
        <table class="table table-bordered table-striped text-center" *ngIf="books.length > 0; else noData">
          <thead class="table-dark">
            <tr>
              <th>#</th>
              <th>عنوان الكتاب</th>
              <th>مؤلف الكتاب</th>
              <th>عدد النسخ</th>
              <th>سنة النشر</th>
              <th>رقم التسجيل</th>
            </tr>
          </thead>
          <tbody>
            @for (book of books; track book) {
              <tr>
                <td>{{ book.id }}</td>
                <td>{{ book.bookTitle }}</td>
                <td>{{ book.bookAuthor }}</td>
                <td>{{ book.numberOfCopies }}</td>
                <td>{{ book.publicationYear }}</td>
                <td>{{ book.registeredNumber }}</td>
              </tr>
            }
          </tbody>
        </table>
      </div>

      <!-- Pagination -->
      <nav *ngIf="totalPages > 1" aria-label="Page navigation" class="mt-3">
        <ul class="pagination justify-content-center">
          <li class="page-item" [class.disabled]="currentPage === 1">
            <button class="page-link" (click)="changePage(currentPage - 1)">السابق</button>
          </li>
          <li class="page-item" *ngIf="pagesToShow[0] > 1">
            <button class="page-link" (click)="changePage(1)">1</button>
            <span class="page-link">...</span>
          </li>
          <li class="page-item" *ngFor="let page of pagesToShow" [class.active]="page === currentPage">
            <button class="page-link" (click)="changePage(page)">{{ page }}</button>
          </li>
          <li class="page-item" *ngIf="pagesToShow[pagesToShow.length - 1] < totalPages">
            <span class="page-link">...</span>
            <button class="page-link" (click)="changePage(totalPages)">{{ totalPages }}</button>
          </li>
          <li class="page-item" [class.disabled]="currentPage === totalPages">
            <button class="page-link" (click)="changePage(currentPage + 1)">التالي</button>
          </li>
        </ul>
      </nav>
          
      <ng-template #noData>
        <div class="text-center text-muted fs-5">لا توجد كتب</div>
      </ng-template>
    </div>
