<div class="text-center py-4" style="font-weight: 700; font-size: 35px; color: #000000;">الأقسام العلمية</div>
<ul class="nav nav-tabs justify-content-start ps-0 mb-0 border-0 px-5" id="myTab" role="tablist">
  @for(cat of categories; track cat;){
    <li class="nav-item custom-tab" role="presentation">
      <button (click)="setSelectedCategoryData(cat)" class="nav-link" [class.active]="selectedCategory?.id== cat.id " id="rail-tab" data-bs-toggle="tab" data-bs-target="#rail" type="button" role="tab" aria-controls="rail" aria-selected="true">
        {{cat.nameAr}}
      </button>
    </li>
  }

</ul>

<!-- Tab Content -->
<div class="tab-content mt-0 px-4" id="myTabContent">
  <div class="tab-pane fade show active" id="rail" role="tabpanel" aria-labelledby="rail-tab">
    <div class="content-box">
      <div class="row">
        <!-- <img 
        [src]="getImageUrl(categoryData?.educationalContents?.[0]?.image)" 
        alt="صورة القسم" 
        (error)="onImageError($event)" 
        style="width: 300px; height: auto; margin: 0 auto 20px; display: block;"

      /> -->
      
        <h1>نبذة عن {{categoryData?.nameAr}}</h1>
        <img 
        [src]="getImageUrl(categoryData?.educationalContents?.[0]?.image)" 
        alt="صورة القسم" 
        (error)="onImageError($event)" 
        style="width: 300px; height: auto; margin: 0 auto 20px; display: block; margin-top: 30px;"

      />
<p class="py-3" style="text-align: justify;">
  {{categoryData?.educationalContents?.[0]?.descriptionAr}}
</p>

<h2 class="mb-3 text-center" style="font-size: 22px; font-weight: 700;">
  أهم ما يدرسه الطالب في قسم {{categoryData?.nameAr}}
</h2>
<p style="text-align: justify; white-space: pre-line;">
  {{categoryData?.educationalContents?.[0]?.mainSubjectsAr}}
</p>

    </div>
  </div>
</div>
