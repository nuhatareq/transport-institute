
<div class="container  news-section">
 <div class="border_line ">
  <div class="row align-items-center mb-4">
    <div class="col-6">
      <p class="section-title py-3 " > الأخبار</p>
    </div>
    <div class="col-6 text-start">
     
    </div>
  </div>
  </div>

  <div class="row g-0 ">
    @for(news of newsList.slice(0, 3); track news){

    <div class="col-12 col-md-4 my-4">
      <div class="news-card ">
        <img src="../../../../assets/C 1.png" class="news-img" alt="خبر">
        <div class="news-content">
          <p class="news-text"> {{news.titleAr}}</p>
            <div class="d-flex justify-content-end">
            <button class="btn-more ">
              المزيد
              <i class="fa-solid fa-arrow-left ms-2 arr"></i>
            </button>
            </div>
        </div>
      </div>
    </div>
  }
  
</div>

<div class="row mt-4">
  <div class="col-11"></div>
  <div class="col-1">
    <button class="btn-more" (click)="showAllNews()">
      المزيد
      <i class="fa-solid fa-arrow-left ms-2 arr"></i>
    </button>
    
  </div>
</div>
</div>
