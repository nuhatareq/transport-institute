<div class="container py-5">
    <div class=" mb-4">
        <h2 style="font-weight: bold; color: #000000;"> مجلس إدارة المعهد</h2>
      </div>
    <div class="row justify-content-center mb-5" *ngIf="list.length">
      <div class="col-md-4 text-center">
        <img
          [src]="imgUrl + list[0].image"
          alt="{{ list[0].nameAr }}"
          class="rounded-circle shadow"
          style="width: 230px; height: 230px; object-fit: cover;"
        />
        <div class="mt-3">
          <h5 style="font-weight: bold;">{{ list[0].nameAr }}</h5>
          <p class="text-muted">{{ list[0].titleAr }}</p>
        </div>
      </div>
    </div>
  
    <div class="row" *ngIf="list.length > 1">
      <ng-container *ngFor="let member of list.slice(1); let i = index">
        <div class="col-md-4 mb-5 d-flex justify-content-center">
          <div class="text-center">
            <img
              [src]="imgUrl + member.image"
              alt="{{ member.nameAr }}"
              class="rounded-circle shadow"
              style="width: 200px; height: 200px; object-fit: cover;"
            />
            <div class="mt-3">
              <h5 style="font-weight: bold;">{{ member.nameAr }}</h5>
              <p class="text-muted">{{ member.titleAr }}</p>
            </div>
          </div>
        </div>
      </ng-container>
    </div>
  </div>
